# Versão Windows/Linux (qt/): compila, roda os testes do núcleo e as capturas
# offscreen do app em Windows (MSVC) e Ubuntu, e gera os pacotes (instalador e
# zip portátil no Windows, AppImage no Linux). Capturas e pacotes ficam nos artefatos.
name: Qt (Windows e Linux)

on:
  push:
    branches: [main, develop, "feature/multiplataforma*", "feature/qt-motion-legendas*"]
    paths: ["qt/**", ".github/workflows/qt.yml", ".github/scripts/**"]
  pull_request:
    paths: ["qt/**", ".github/workflows/qt.yml", ".github/scripts/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qt-${{ github.ref }}
  cancel-in-progress: true

env:
  # FFmpeg "gpl-shared" do BtbN, versão fixa. Os builds de fim de mês ficam
  # publicados por tempo indeterminado; os diários somem em poucas semanas.
  FFMPEG_RELEASE: autobuild-2026-09-30-13-08
  FFMPEG_BUILD: ffmpeg-n9.0.2-17-g2a571b6068
  # Modelo "base" do Whisper (o mesmo arquivo e sha256 de qt/src/core/WhisperModels.cpp),
  # para o teste de transcrição. A chave do cache é o sha256.
  WHISPER_BASE_URL: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin
  WHISPER_BASE_SHA256: 60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe
  # O ilammy/msvc-dev-cmd ainda não tem versão em Node 24 (nem a v1.13.0); as
  # outras actions já têm. Força o Node 24 em todas, até ele publicar uma.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC)
            os: windows-latest
            # Desde o Qt 6.11 o repositório do Windows tem um Updates.xml por
            # arquitetura, que o aqtinstall 3.3 ainda não lê. O 6.10.3 é o mais
            # novo no formato antigo (o núcleo e o app pedem 6.8 ou mais).
            qt-version: "6.10.3"
            qt-arch: win64_msvc2022_64
            ffmpeg-asset: win64-gpl-shared-9.0.zip
            ffmpeg-sha256: 3da6c7b60bb9ccd73ec5b5e815ba804a0879eb362ba0e3beebce50174c022696
            # No Windows o qt_standard_project_setup põe os executáveis na raiz do build.
            app: build/OpenFrame.exe
          - name: Linux (Ubuntu 24.04)
            os: ubuntu-24.04
            qt-version: "6.12.0"
            qt-arch: linux_gcc_64
            ffmpeg-asset: linux64-gpl-shared-9.0.tar.xz
            ffmpeg-sha256: 01a9764d0b5364b66cfeb4617557c64321b0e232e172ec73f0a701c5f7694326
            app: build/src/app/OpenFrame
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v5

      - name: Dependências do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 \
            libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1-dev libfreetype-dev fonts-dejavu-core \
            libpulse0 libasound2t64 desktop-file-utils libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 \
            libva2 libva-drm2 libva-x11-2

      - name: Compilador MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Ninja (Windows)
        if: runner.os == 'Windows'
        run: command -v ninja || choco install ninja -y --no-progress

      - name: Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          modules: qtmultimedia
          aqtversion: "==3.3.*"
          cache: true

      - name: Cache do FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_BUILD }}-${{ matrix.ffmpeg-asset }}

      - name: Baixar o FFmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/${{ env.FFMPEG_RELEASE }}/${{ env.FFMPEG_BUILD }}-${{ matrix.ffmpeg-asset }}
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o ffmpeg-pacote "$URL"
          echo "${{ matrix.ffmpeg-sha256 }}  ffmpeg-pacote" | sha256sum -c -
          mkdir extraido
          if [[ "$URL" == *.zip ]]; then 7z x -bd -oextraido ffmpeg-pacote > /dev/null; else tar -xJf ffmpeg-pacote -C extraido; fi
          mv extraido/* ffmpeg
          rm -rf ffmpeg-pacote extraido

      - name: FFmpeg no ambiente
        run: |
          root="$RUNNER_TEMP/ffmpeg"
          if [[ "$RUNNER_OS" == Windows ]]; then root=$(cygpath -m "$root"); fi
          echo "FFMPEG_ROOT=$root" >> "$GITHUB_ENV"
          # DLLs (Windows) e o ffmpeg de linha de comando, que gera a mídia de teste.
          echo "$root/bin" >> "$GITHUB_PATH"
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo "LD_LIBRARY_PATH=$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
          fi
          "$root/bin/ffmpeg" -hide_banner -version | head -n 1

      - name: Cache do modelo Whisper (base)
        id: whisper-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/whisper-models
          key: whisper-ggml-base-${{ runner.os }}-${{ env.WHISPER_BASE_SHA256 }}

      - name: Baixar o modelo Whisper (base)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/whisper-models"
          cd "$RUNNER_TEMP/whisper-models"
          curl -fsSL --retry 3 -o ggml-base.bin.parcial "$WHISPER_BASE_URL"
          echo "$WHISPER_BASE_SHA256  ggml-base.bin.parcial" | sha256sum -c -
          mv ggml-base.bin.parcial ggml-base.bin

      # Com OPENFRAME_REQUIRE_WHISPER_MODEL, o teste de transcrição falha em vez
      # de pular quando o modelo falta: na CI o pulo não pode acontecer.
      - name: Modelo Whisper no ambiente
        run: |
          models="$RUNNER_TEMP/whisper-models"
          if [[ "$RUNNER_OS" == Windows ]]; then models=$(cygpath -m "$models"); fi
          echo "OPENFRAME_MODELS_DIR=$models" >> "$GITHUB_ENV"
          echo "OPENFRAME_REQUIRE_WHISPER_MODEL=1" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/whisper-models"

      # O /utf-8 do MSVC vem do qt/CMakeLists.txt. Por CXXFLAGS, o Git Bash
      # o converte num caminho (C:/Program Files/Git/utf-8).
      - name: Configurar
        run: cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        run: cmake --build build --parallel

      # Diagnóstico do WhisperUnitTests: a detecção automática de proxy (WPAD) pode
      # atrasar a primeira conexão do Qt, mesmo para 127.0.0.1.
      - name: Proxy do sistema (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          netsh winhttp show proxy
          reg query "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Internet Settings" || true

      - name: Testes do núcleo
        run: |
          ctest --test-dir build --output-on-failure --timeout 600 && exit 0
          # Diagnóstico no Windows: o CRT guarda a saída em buffer e um teste que
          # cai não imprime nada; o código de saída mostra o tipo da queda.
          if [[ "$RUNNER_OS" == Windows ]]; then
            for t in $(ctest --test-dir build --rerun-failed -N | sed -n 's/.*Test *#[0-9]*: //p'); do
              for qpa in windows offscreen; do
                status=0
                exe=$(find build -name "$t.exe" | head -n 1)
                rm -f diag.txt
                # A plataforma vai pelo ambiente: as suítes sem interface
                # (QTEST_GUILESS_MAIN) recusam a opção -platform.
                QT_QPA_PLATFORM="$qpa" "$exe" -o diag.txt,txt -v2 || status=$?
                echo "== $t ($qpa): saída $status"
                grep -E -A4 'FAIL!|QFATAL|QCRITICAL|QWARN' diag.txt 2>/dev/null | head -n 60 || true
                tail -n 15 diag.txt 2>/dev/null || true
              done
            done
          fi
          exit 1

      # No Windows a captura usa a plataforma nativa com o Qt Quick por software
      # (o offscreen do Windows não tem banco de fontes próprio).
      - name: Capturas offscreen do app
        env:
          OPENFRAME_QPA: ${{ runner.os == 'Windows' && 'windows' || 'offscreen' }}
          OPENFRAME_SOFTWARE: ${{ runner.os == 'Windows' && '1' || '' }}
          OPENFRAME_CAPTURAS_MOTION: "1"
          OPENFRAME_CAPTURAS_AUDIO: "1"
        run: .github/scripts/capturas.sh "${{ matrix.app }}" capturas

      - name: Publicar as capturas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capturas-${{ runner.os }}
          path: capturas
          if-no-files-found: warn
          retention-days: 14

      - name: Pacotes
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            .github/scripts/pacote-windows.sh build pacotes
          else
            .github/scripts/pacote-linux.sh build pacotes
          fi

      # O pacote extraído leva o whisper/ggml com as variantes de CPU e o plugin de
      # TLS, baixa por HTTPS e transcreve uma fala com uma variante de dentro dele.
      - name: Conferir o pacote (whisper e TLS)
        run: .github/scripts/conferir-pacote.sh pacotes conferencia

      - name: Publicar a conferência do pacote
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: conferencia-${{ runner.os }}
          path: conferencia
          if-no-files-found: ignore
          retention-days: 14

      # Tira a libva do sistema e toca o AppImage gravando a saída de som: prova que
      # o pacote, sem o plugin de mídia do Qt, não cai e o som sai.
      - name: AppImage sem libva, com som
        if: runner.os == 'Linux'
        run: .github/scripts/som-appimage.sh pacotes/*.AppImage som

      - name: Publicar o teste de som
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: som-Linux
          path: som
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar os pacotes
        uses: actions/upload-artifact@v6
        with:
          name: OpenFrame-${{ runner.os }}
          path: |
            pacotes/*.zip
            pacotes/*.exe
            pacotes/*.AppImage
          if-no-files-found: error
          retention-days: 14
